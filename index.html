<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rede de Indicadores ODS SC</title>
<style>
  :root{
    color-scheme:light;
    --bg:#ffffff; --surface:#ffffff; --ink:#000000; --muted:#333333; --faint:#666666;
    --line:#999999; --pos:#1f5fa8; --neg:#b2182b; --focus:#0000ee; --halo:#ffffff;
    --iso-stroke:#000000; --chip:#eeeeee;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Arial,Helvetica,sans-serif}
  .mono{font-variant-numeric:tabular-nums}
  .app{display:grid;grid-template-rows:auto 1fr;height:100%;padding-inline:16px;padding-block:12px;gap:10px}

  header{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .titulo h1{margin:0;font-size:18px;font-weight:bold}
  .titulo p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .numeros{font-size:13px}
  .controles{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px}
  .seg{display:inline-flex;gap:3px}
  .seg button{border:1px solid var(--line);background:#f0f0f0;color:var(--ink);font:inherit;font-size:13px;padding:2px 8px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:#000;color:#fff;border-color:#000}
  .seg-rot{margin-right:4px}
  .busca{position:relative}
  .busca input{width:240px;max-width:100%;height:24px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13px;padding:0 5px}
  .busca ul{position:absolute;z-index:5;top:26px;left:0;min-width:320px;margin:0;padding:0;list-style:none;background:#fff;border:1px solid #000}
  .busca li{padding:4px 6px;cursor:pointer;font-size:13px}
  .busca li:hover,.busca li.ativo{background:var(--chip)}
  button:focus-visible,input:focus-visible,li:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

  main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;min-height:0}
  .palco{position:relative;border:1px solid var(--line);overflow:hidden;min-height:420px}
  svg#rede{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  svg#rede.arrastando{cursor:grabbing}
  .aresta{fill:none}
  .no circle{cursor:pointer}
  .no text{font:8.5px Arial,Helvetica,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3px;pointer-events:none}
  .faixa-rot{font:11px Arial,Helvetica,sans-serif;fill:var(--faint)}
  .faixa-linha{stroke:var(--line);stroke-dasharray:2 3}
  .apagado{opacity:.08}
  .no.apagado text{opacity:0}
  .zoom{position:absolute;right:6px;bottom:6px;display:flex;gap:3px}
  .zoom button{width:26px;height:24px;border:1px solid var(--line);background:#f0f0f0;color:var(--ink);font-size:14px;cursor:pointer;padding:0}
  .legenda{position:absolute;left:6px;bottom:6px;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11px;color:var(--muted);max-width:calc(100% - 100px);background:#fff;padding:2px 4px}
  .legenda span{display:inline-flex;align-items:center;gap:4px}
  .legenda i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .legenda .ln{width:16px;height:0;border-top:2px solid var(--pos);border-radius:0}
  .legenda .ln.neg{border-top:2px dashed var(--neg)}
  .dica{position:absolute;pointer-events:none;background:#fff;color:#000;border:1px solid #000;font-size:12px;padding:3px 6px;max-width:280px;z-index:4}

  aside{border:1px solid var(--line);overflow:auto;padding:10px 12px;min-height:0;font-size:13px}
  aside h2{font-size:13px;font-weight:bold;margin:16px 0 4px}
  aside h2:first-child{margin-top:0}
  .nota{color:var(--muted);margin:0}
  .lista{list-style:none;margin:0;padding:0}
  .lista li{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:baseline;padding:3px 0;border-bottom:1px solid #e5e5e5;cursor:pointer}
  .lista li:hover span:nth-child(2){text-decoration:underline}
  .lista .v{color:var(--muted)}
  .ods{display:inline-block;min-width:22px;padding:0 3px;text-align:center;color:#fff;font:bold 11px Arial,Helvetica,sans-serif}
  .sinal{width:8px;height:8px;border-radius:50%;display:inline-block}
  .sinal.p{background:var(--pos)} .sinal.n{background:transparent;border:2px solid var(--neg)}
  .det-topo{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .det-nome{font-size:15px;font-weight:bold;margin:0 0 4px}
  .det-cod{color:var(--faint);font-size:12px}
  .metricas{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin-top:8px}
  .metricas div{display:contents}
  .metricas div span{color:var(--muted)}
  .metricas div b{font-weight:normal}
  .voltar{border:0;background:none;color:var(--focus);text-decoration:underline;font:inherit;padding:0;cursor:pointer;margin-bottom:10px}
  .rodape{font-size:12px;color:var(--faint);margin-top:16px;padding-top:8px;border-top:1px solid var(--line)}

  @media (max-width:860px){
    .app{height:auto}
    main{grid-template-columns:1fr}
    .palco{height:70vh}
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="titulo">
      <h1>Rede de associações entre indicadores ODS</h1>
      <p>Santa Catarina · 295 municípios · IDSC-BR</p>
    </div>
    <div class="numeros" id="numeros"></div>
    <div class="controles">
      <span><span class="seg-rot">Cor:</span>
        <span class="seg" role="group" aria-label="Colorir nós por">
          <button id="cor-com" aria-pressed="true">Comunidade</button><button id="cor-ods" aria-pressed="false">ODS</button>
        </span></span>
      <span><span class="seg-rot">Associações:</span>
        <span class="seg" role="group" aria-label="Mostrar associações">
          <button id="f-todas" aria-pressed="true">Todas</button><button id="f-pos" aria-pressed="false">Positivas</button><button id="f-neg" aria-pressed="false">Negativas</button>
        </span></span>
      <div class="busca">
        <input id="busca" type="search" placeholder="Buscar indicador…" autocomplete="off" aria-label="Buscar indicador">
        <ul id="sugestoes" hidden></ul>
      </div>
    </div>
  </header>

  <main>
    <div class="palco">
      <svg id="rede" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet" aria-label="Rede de indicadores">
        <g id="camada">
          <line class="faixa-linha" x1="30" x2="970" y1="690" y2="690"></line>
          <text class="faixa-rot" x="34" y="708">Fora do componente principal: componentes menores e indicadores sem associação</text>
          <g id="g-arestas"></g>
          <g id="g-nos"></g>
        </g>
      </svg>
      <div class="legenda" id="legenda"></div>
      <div class="zoom">
        <button id="z-mais" aria-label="Aproximar">+</button><button id="z-menos" aria-label="Afastar">−</button><button id="z-reset" aria-label="Enquadrar a rede">⤢</button>
      </div>
      <div class="dica" id="dica" hidden></div>
    </div>
    <aside id="painel" aria-live="polite"></aside>
  </main>
</div>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d=2) => v.toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const curto = id => id.replace(/^SDG/, '');
const cor = n => modoCor === 'ods' ? CORES_ODS[n.ods] : CORES_COM[n.com];
const raio = n => n.com > 0 ? 5 + 17 * Math.sqrt(n.inter / maxInter) : 5;
const badge = o => `<span class="ods" style="background:${CORES_ODS[o]}">${o}</span>`;

// números do cabeçalho
const nPos = arestas.filter(a => a.r > 0).length;
$('numeros').textContent = `${nos.length} indicadores, ${arestas.length} associações (${nPos} positivas, ${arestas.length - nPos} negativas).`;

// desenho
const gA = $('g-arestas'), gN = $('g-nos');
const elAresta = arestas.map(a => {
  const s = porId[a.s], t = porId[a.t];
  const l = document.createElementNS(NS, 'line');
  l.setAttribute('x1', s.x); l.setAttribute('y1', s.y); l.setAttribute('x2', t.x); l.setAttribute('y2', t.y);
  l.setAttribute('class', 'aresta');
  l.setAttribute('stroke', a.r > 0 ? 'var(--pos)' : 'var(--neg)');
  l.setAttribute('stroke-width', (0.7 + 5 * (Math.abs(a.r) - R_MIN)).toFixed(2));
  l.setAttribute('stroke-opacity', '0.5');
  if (a.r < 0) l.setAttribute('stroke-dasharray', '5 3');
  gA.appendChild(l);
  return {a, l};
});
const elNo = {};
[...nos].sort((a,b) => raio(a) - raio(b)).forEach(n => {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'no'); g.setAttribute('tabindex', '0');
  g.setAttribute('role', 'button'); g.setAttribute('aria-label', n.nome);
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', raio(n));
  c.setAttribute('stroke', n.grau === 0 ? 'var(--iso-stroke)' : 'var(--surface)');
  c.setAttribute('stroke-width', n.grau === 0 ? 1.2 : 1.5);
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', n.x + raio(n) + 2); t.setAttribute('y', n.y + 3);
  t.textContent = curto(n.id);
  g.append(c, t); gN.appendChild(g);
  g.addEventListener('mouseenter', e => { emFoco = n.id; destacar(); dica(e, n); });
  g.addEventListener('mousemove', e => dica(e, n));
  g.addEventListener('mouseleave', () => { emFoco = null; destacar(); $('dica').hidden = true; });
  g.addEventListener('click', e => { e.stopPropagation(); selecionar(n.id); });
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selecionar(n.id); } });
  elNo[n.id] = {g, c};
});

function pintar(){
  nos.forEach(n => elNo[n.id].c.setAttribute('fill', cor(n)));
  const itens = modoCor === 'ods'
    ? [...new Set(nos.map(n => n.ods))].sort((a,b) => a-b).map(o => `<span><i style="background:${CORES_ODS[o]}"></i>${o}</span>`)
    : [1,2,3,4].map(c => `<span><i style="background:${CORES_COM[c]}"></i>Comunidade ${c}</span>`).concat(`<span><i style="background:${CORES_COM[0]}"></i>Fora do principal</span>`);
  $('legenda').innerHTML = itens.join('') + '<span><i class="ln"></i>positiva</span><span><i class="ln neg"></i>negativa</span>';
}

const passa = a => filtro === 'todas' || (filtro === 'pos' ? a.r > 0 : a.r < 0);

function destacar(){
  const foco = emFoco || selecionado;
  const viz = foco ? new Set([foco, ...vizinhos[foco].filter(v => passa({r:v.r})).map(v => v.id)]) : null;
  elAresta.forEach(({a, l}) => {
    const visivel = passa(a);
    l.style.display = visivel ? '' : 'none';
    l.classList.toggle('apagado', !!foco && !(a.s === foco || a.t === foco));
  });
  nos.forEach(n => elNo[n.id].g.classList.toggle('apagado', !!viz && !viz.has(n.id)));
}

function dica(e, n){
  const d = $('dica'), caixa = d.parentElement.getBoundingClientRect();
  d.innerHTML = `${esc(n.nome)}<br><span class="mono" style="opacity:.7">ODS ${n.ods} · grau ${n.grau}</span>`;
  d.hidden = false;
  const x = Math.min(e.clientX - caixa.left + 14, caixa.width - 290);
  d.style.left = Math.max(8, x) + 'px'; d.style.top = (e.clientY - caixa.top + 14) + 'px';
}

// painel
function itemIndicador(n, valor){
  return `<li data-id="${n.id}" tabindex="0">${badge(n.ods)}<span>${esc(n.nome)}</span><span class="v mono">${valor}</span></li>`;
}
function ligarLista(){
  $('painel').querySelectorAll('[data-id]').forEach(li => {
    li.addEventListener('click', () => selecionar(li.dataset.id));
    li.addEventListener('keydown', e => { if (e.key === 'Enter') selecionar(li.dataset.id); });
  });
  const v = $('voltar'); if (v) v.addEventListener('click', () => selecionar(null));
}
const RODAPE = `<p class="rodape">Aresta quando |r| ≥ 0,3 e p &lt; 0,05 (Spearman sobre a média municipal de cada indicador, 2010–2025). Associação estatística: não indica causalidade, e o sinal não equivale a sinergia ou trade-off.</p>`;

function painelGeral(){
  const top = rankInter.slice(0, 8).map(id => itemIndicador(porId[id], fmt(porId[id].inter, 3))).join('');
  const fora = nos.filter(n => n.com === 0).sort((a,b) => b.grau - a.grau || a.ods - b.ods);
  const coms = [1,2,3,4].map(c => `<li style="cursor:default"><i class="sinal" style="background:${CORES_COM[c]}"></i><span>Comunidade ${c}</span><span class="v mono">${principal.filter(n => n.com === c).length}</span></li>`).join('');
  $('painel').innerHTML = `
    <h2>Como ler</h2>
    <p class="nota">Cada nó é um indicador; cada linha, uma associação estatística entre dois indicadores nos 295 municípios. Tamanho do nó = centralidade de intermediação. Clique num indicador para ver suas associações.</p>
    <h2>Maior intermediação</h2>
    <ul class="lista">${top}</ul>
    <h2>Comunidades (Louvain)</h2>
    <ul class="lista">${coms}</ul>
    <h2>Fora do componente principal (${fora.length})</h2>
    <ul class="lista">${fora.map(n => itemIndicador(n, n.grau ? n.grau + ' assoc.' : 'isolado')).join('')}</ul>
    ${RODAPE}`;
  ligarLista();
}

function painelDetalhe(n){
  const lig = [...vizinhos[n.id]].sort((a,b) => Math.abs(b.r) - Math.abs(a.r));
  const pos = rankInter.indexOf(n.id);
  const lista = lig.length
    ? `<ul class="lista">${lig.map(v => { const m = porId[v.id];
        return `<li data-id="${m.id}" tabindex="0"><i class="sinal ${v.r > 0 ? 'p' : 'n'}"></i><span>${esc(m.nome)} <span class="det-cod mono">ODS ${m.ods}</span></span><span class="v mono">${v.r > 0 ? '+' : '−'}${fmt(Math.abs(v.r), 2)}</span></li>`; }).join('')}</ul>`
    : `<p class="nota">Nenhuma associação com este indicador atendeu aos critérios (|r| ≥ 0,3 e p &lt; 0,05).</p>`;
  $('painel').innerHTML = `
    <button class="voltar" id="voltar">← Visão geral</button>
    <div class="det-topo">${badge(n.ods)}<span class="det-cod mono">${n.id}</span></div>
    <p class="det-nome">${esc(n.nome)}</p>
    <div class="metricas">
      <div><span>Associações</span><b class="mono">${n.grau}</b></div>
      <div><span>Comunidade</span><b>${n.com || '—'}</b></div>
      <div><span>Intermediação</span><b class="mono">${n.com ? fmt(n.inter, 3) : '—'}</b></div>
      <div><span>Posição</span><b class="mono">${pos >= 0 ? (pos + 1) + 'º de ' + rankInter.length : '—'}</b></div>
      <div><span>Cobertura</span><b class="mono">${fmt(n.cob * 100, 1)}%</b></div>
      <div><span>+ / −</span><b class="mono">${lig.filter(v => v.r > 0).length} / ${lig.filter(v => v.r < 0).length}</b></div>
    </div>
    <h2>Associações (${lig.length})</h2>
    ${lista}
    ${RODAPE}`;
  ligarLista();
}

function selecionar(id){
  selecionado = id;
  id ? painelDetalhe(porId[id]) : painelGeral();
  destacar();
}

// controles
function grupo(ids, aoEscolher){
  ids.forEach(id => $(id).addEventListener('click', () => {
    ids.forEach(o => $(o).setAttribute('aria-pressed', o === id)); aoEscolher(id);
  }));
}
grupo(['cor-com','cor-ods'], id => { modoCor = id === 'cor-ods' ? 'ods' : 'com'; pintar(); });
grupo(['f-todas','f-pos','f-neg'], id => { filtro = {'f-todas':'todas','f-pos':'pos','f-neg':'neg'}[id]; destacar(); });

// busca
const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const busca = $('busca'), sug = $('sugestoes');
let achados = [], ativo = 0;
function mostrarSugestoes(){
  const q = semAcento(busca.value.trim());
  achados = q ? nos.filter(n => semAcento(n.nome + ' ' + n.id).includes(q)).slice(0, 8) : [];
  ativo = 0;
  sug.hidden = !achados.length;
  sug.innerHTML = achados.map((n, i) => `<li data-i="${i}" class="${i === 0 ? 'ativo' : ''}">${badge(n.ods)} ${esc(n.nome)}</li>`).join('');
  sug.querySelectorAll('li').forEach(li => li.addEventListener('mousedown', e => { e.preventDefault(); escolher(+li.dataset.i); }));
}
function escolher(i){ const n = achados[i]; if (!n) return; busca.value = ''; sug.hidden = true; selecionar(n.id); }
busca.addEventListener('input', mostrarSugestoes);
busca.addEventListener('keydown', e => {
  if (sug.hidden) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); ativo = (ativo + (e.key === 'ArrowDown' ? 1 : -1) + achados.length) % achados.length;
    sug.querySelectorAll('li').forEach((li, i) => li.classList.toggle('ativo', i === ativo));
  } else if (e.key === 'Enter') { e.preventDefault(); escolher(ativo); }
  else if (e.key === 'Escape') sug.hidden = true;
});
busca.addEventListener('blur', () => setTimeout(() => sug.hidden = true, 100));

// zoom e arraste
const svg = $('rede');
const VB0 = {x:0, y:0, w:1000, h:800};
let vb = {...VB0};
const aplicar = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
function zoom(f, cx = vb.x + vb.w/2, cy = vb.y + vb.h/2){
  const w = Math.min(1400, Math.max(180, vb.w * f)), k = w / vb.w;
  vb = {x: cx - (cx - vb.x) * k, y: cy - (cy - vb.y) * k, w, h: vb.h * k}; aplicar();
}
function pontoSvg(e){
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('wheel', e => { e.preventDefault(); const p = pontoSvg(e); zoom(e.deltaY > 0 ? 1.12 : 1/1.12, p.x, p.y); }, {passive:false});
let arraste = null;
svg.addEventListener('pointerdown', e => {
  if (e.target.closest('.no')) return;
  arraste = {p: pontoSvg(e), moveu: false}; svg.setPointerCapture(e.pointerId); svg.classList.add('arrastando');
});
svg.addEventListener('pointermove', e => {
  if (!arraste) return;
  const p = pontoSvg(e);
  vb.x -= p.x - arraste.p.x; vb.y -= p.y - arraste.p.y; arraste.moveu = true; aplicar();
});
svg.addEventListener('pointerup', () => {
  if (arraste && !arraste.moveu && selecionado) selecionar(null);
  arraste = null; svg.classList.remove('arrastando');
});
$('z-mais').addEventListener('click', () => zoom(1/1.25));
$('z-menos').addEventListener('click', () => zoom(1.25));
$('z-reset').addEventListener('click', () => { vb = {...VB0}; aplicar(); });

pintar();
painelGeral();
destacar();
</script>

</body>
</html>
